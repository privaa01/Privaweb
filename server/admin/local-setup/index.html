<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Configura tu acceso local — Priva</title><link rel="stylesheet" href="/admin/local-setup.css"></head><body><main><h1>Configura tu acceso local</h1><p>Define una contraseña para usar el panel de Priva en este computador.</p><noscript><p>Activa JavaScript para crear el acceso local.</p></noscript><form data-code-form method="post" action="/api/local/configuracion"><label for="setup-code">Código de configuración local</label><input id="setup-code" name="setupCode" required autocomplete="off" spellcheck="false"><button>Continuar</button></form><form data-setup-form hidden method="post" action="/api/local/configuracion"><label for="owner">Correo</label><input id="owner" type="email" readonly autocomplete="username"><p>Usa entre 15 y 128 caracteres. Esta contraseña será exclusiva de tu acceso local.</p><label for="password">Contraseña nueva</label><input id="password" name="password" type="password" autocomplete="new-password" required><label for="confirmation">Confirma la contraseña</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required><button disabled>Crear acceso local</button><p role="status" aria-live="polite"></p></form></main><script src="/admin/local-setup.js"></script></body></html>
